
name: Intel oneAPI 2024.2 Component Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Inspect Intel Toolkit Packages
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Prepare Report Directory
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\intel-inventory"
          New-Item -ItemType Directory -Force -Path $dir |
            Out-Null

          Write-Host "Report directory: $dir"

      - name: Download Intel Installers
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP\basekit.exe"
          $hpc  = "$env:RUNNER_TEMP\hpckit.exe"

          $baseUrl = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e83a8e64-04fc-45df-85c6-c2208d03bdb5/w_BaseKit_p_2024.2.0.635_offline.exe"

          $hpcUrl = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d500705-397e-41b3-8b2b-2a3da1753fc2/w_HPCKit_p_2024.2.0.633_offline.exe"

          Write-Host "Downloading Base Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $base $baseUrl

          if ($LASTEXITCODE -ne 0) {
            throw "Base Toolkit download failed."
          }

          Write-Host "Downloading HPC Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $hpc $hpcUrl

          if ($LASTEXITCODE -ne 0) {
            throw "HPC Toolkit download failed."
          }

          Get-Item $base, $hpc |
            Select-Object Name, Length

      - name: Inspect Base Toolkit
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\basekit.exe"
          $dir = "$env:RUNNER_TEMP\intel-inventory"

          $stdout = "$dir\base-stdout.txt"
          $stderr = "$dir\base-stderr.txt"
          $report = "$dir\base-report.txt"

          Write-Host "Inspecting Base Toolkit..."

          try {
            $proc = Start-Process `
              -FilePath $exe `
              -ArgumentList "-s -a --list-components" `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            $code = $proc.ExitCode

            Write-Host "Base Toolkit exit code: $code"

            @"
          BASE TOOLKIT INVENTORY
          Exit Code: $code

          STANDARD OUTPUT:
          $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue)

          STANDARD ERROR:
          $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          "@ | Set-Content $report

          } catch {
            $_ | Out-String |
              Set-Content $report

            Write-Warning "Base inspection exception captured."
          }

          Get-Content $report

      - name: Inspect HPC Toolkit
        if: always()
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\hpckit.exe"
          $dir = "$env:RUNNER_TEMP\intel-inventory"

          $stdout = "$dir\hpc-stdout.txt"
          $stderr = "$dir\hpc-stderr.txt"
          $report = "$dir\hpc-report.txt"

          if (!(Test-Path $exe)) {
            "HPC installer was not downloaded." |
              Set-Content $report

            Write-Warning "HPC installer missing."
            exit 0
          }

          Write-Host "Inspecting HPC Toolkit..."

          try {
            $proc = Start-Process `
              -FilePath $exe `
              -ArgumentList "-s -a --list-components" `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            $code = $proc.ExitCode

            Write-Host "HPC Toolkit exit code: $code"

            @"
          HPC TOOLKIT INVENTORY
          Exit Code: $code

          STANDARD OUTPUT:
          $(Get-Content $stdout -Raw -ErrorAction SilentlyContinue)

          STANDARD ERROR:
          $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
          "@ | Set-Content $report

          } catch {
            $_ | Out-String |
              Set-Content $report

            Write-Warning "HPC inspection exception captured."
          }

          Get-Content $report

      - name: Upload Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-2024.2-diagnostic-reports
          path: ${{ runner.temp }}/intel-inventory/
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup Installers
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP\basekit.exe" `
            -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:RUNNER_TEMP\hpckit.exe" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "Installer cleanup completed."
