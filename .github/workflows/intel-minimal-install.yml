
name: Intel oneAPI 2024.2 Minimal Install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install Required Intel Components
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      # ==========================================
      # 1. PREFLIGHT
      # ==========================================
      - name: Preflight
        shell: pwsh
        run: |
          Write-Host "========== PREFLIGHT =========="

          $disk = Get-CimInstance Win32_LogicalDisk `
            -Filter "DeviceID='C:'"

          $free = [math]::Round(
            $disk.FreeSpace / 1GB, 2
          )

          Write-Host "Available disk: $free GB"

          if ($free -lt 35) {
            throw "Insufficient disk space."
          }

          $logDir = "$env:RUNNER_TEMP\intel-logs"

          New-Item -ItemType Directory -Force `
            -Path $logDir | Out-Null

          Write-Host "Preflight successful."

      # ==========================================
      # 2. DOWNLOAD INSTALLERS
      # ==========================================
      - name: Download Intel Installers
        shell: pwsh
        run: |
          $baseUrl = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e83a8e64-04fc-45df-85c6-c2208d03bdb5/w_BaseKit_p_2024.2.0.635_offline.exe"

          $hpcUrl = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d500705-397e-41b3-8b2b-2a3da1753fc2/w_HPCKit_p_2024.2.0.633_offline.exe"

          $baseFile = "$env:RUNNER_TEMP\basekit.exe"
          $hpcFile = "$env:RUNNER_TEMP\hpckit.exe"

          Write-Host "Downloading Base Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $baseFile $baseUrl

          if ($LASTEXITCODE -ne 0) {
            throw "Base Toolkit download failed."
          }

          Write-Host "Downloading HPC Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $hpcFile $hpcUrl

          if ($LASTEXITCODE -ne 0) {
            throw "HPC Toolkit download failed."
          }

          Get-Item $baseFile, $hpcFile |
            Select-Object Name, Length

          Write-Host "Both installers downloaded successfully."

      # ==========================================
      # 3. INSTALL INTEL MKL
      # ==========================================
      - name: Install Intel oneMKL
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\basekit.exe"
          $log = "$env:RUNNER_TEMP\intel-logs\base-install"

          Write-Host "Installing Intel oneMKL..."

          $installerArgs = @(
            "-s",
            "-a",
            "--silent",
            "--eula",
            "accept",
            "--action",
            "install",
            "--components",
            "intel.oneapi.win.mkl.devel",
            "-p=NEED_VS2022_INTEGRATION=0"
          )

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList $installerArgs `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput "$log-stdout.txt" `
            -RedirectStandardError "$log-stderr.txt"

          Write-Host "Base installer exit code: $($proc.ExitCode)"

          Get-Content "$log-stdout.txt" `
            -ErrorAction SilentlyContinue

          Get-Content "$log-stderr.txt" `
            -ErrorAction SilentlyContinue

          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Intel oneMKL installation failed: $($proc.ExitCode)"
          }

          Write-Host "Intel oneMKL installation completed."

      # ==========================================
      # 4. INSTALL INTEL FORTRAN + MPI
      # ==========================================
      - name: Install Intel Fortran and MPI
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\hpckit.exe"
          $log = "$env:RUNNER_TEMP\intel-logs\hpc-install"

          Write-Host "Installing Intel Fortran and MPI..."

          $components = "intel.oneapi.win.mpi.devel:intel.oneapi.win.ifort-compiler"

          $installerArgs = @(
            "-s",
            "-a",
            "--silent",
            "--eula",
            "accept",
            "--action",
            "install",
            "--components",
            $components,
            "-p=NEED_VS2022_INTEGRATION=0"
          )

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList $installerArgs `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput "$log-stdout.txt" `
            -RedirectStandardError "$log-stderr.txt"

          Write-Host "HPC installer exit code: $($proc.ExitCode)"

          Get-Content "$log-stdout.txt" `
            -ErrorAction SilentlyContinue

          Get-Content "$log-stderr.txt" `
            -ErrorAction SilentlyContinue

          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Intel Fortran/MPI installation failed: $($proc.ExitCode)"
          }

          Write-Host "Intel Fortran and MPI installation completed."

      # ==========================================
      # 5. VERIFY INTEL TOOLCHAIN
      # ==========================================
      - name: Verify IFX MPI and MKL
        shell: cmd
        run: |
          @echo on

          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 vs2022

          if errorlevel 1 exit /b 1

          echo.
          echo =================================
          echo CHECK INTEL FORTRAN COMPILER
          echo =================================

          where ifx
          if errorlevel 1 exit /b 1

          echo.
          echo =================================
          echo TEST FORTRAN COMPILATION
          echo =================================

          set "TESTDIR=%RUNNER_TEMP%\ifx-smoke-test"

          if not exist "%TESTDIR%" mkdir "%TESTDIR%"

          cd /d "%TESTDIR%"

          > hello.f90 echo print *, "IFX_COMPILE_OK"
          >> hello.f90 echo end

          ifx hello.f90

          if errorlevel 1 exit /b 1

          if not exist hello.exe exit /b 1

          "%TESTDIR%\hello.exe"

          if errorlevel 1 exit /b 1

          echo.
          echo =================================
          echo CHECK INTEL MPI
          echo =================================

          where mpiexec
          if errorlevel 1 exit /b 1

          mpiexec -version

          if errorlevel 1 exit /b 1

          echo.
          echo =================================
          echo INTEL TOOLCHAIN BASIC CHECK OK
          echo =================================

      # ==========================================
      # 6. VERIFY MKL
      # ==========================================
      - name: Verify Intel oneMKL
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Intel\oneAPI\mkl"

          if (!(Test-Path $root)) {
            throw "oneMKL directory not found."
          }

          $header = Get-ChildItem `
            -Path $root `
            -Filter "mkl.h" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$header) {
            throw "Intel oneMKL header mkl.h not found."
          }

          Write-Host "Intel oneMKL verified:"
          Write-Host $header.FullName

      # ==========================================
      # 7. UPLOAD LOGS
      # ==========================================
      - name: Upload Installation Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-minimal-install-logs
          path: ${{ runner.temp }}\intel-logs\
          if-no-files-found: warn
          retention-days: 3

      # ==========================================
      # 8. CLEANUP
      # ==========================================
      - name: Cleanup Installers
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP\basekit.exe" `
            -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:RUNNER_TEMP\hpckit.exe" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "Cleanup completed."
