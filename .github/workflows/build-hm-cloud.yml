
name: Delft3D Full HM Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hm:
    name: Build Delft3D FLOW and WAVE
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # =========================================
      # 1. CHECK CLOUD ENVIRONMENT
      # =========================================
      - name: Check Cloud Environment
        shell: pwsh
        run: |
          Write-Host "========== CLOUD PREFLIGHT =========="

          $disk = Get-CimInstance Win32_LogicalDisk `
            -Filter "DeviceID='C:'"

          $free = [math]::Round(
            $disk.FreeSpace / 1GB, 2
          )

          Write-Host "Available disk: $free GB"

          if ($free -lt 35) {
            throw "Insufficient cloud disk space."
          }

          cmake --version
          python --version
          git --version

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "Visual Studio vswhere.exe not found."
          }

          $vs = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vs) {
            throw "Visual Studio 2022 C++ tools not found."
          }

          Write-Host "Visual Studio: $vs"

          "VS_PATH=$vs" |
            Out-File -FilePath $env:GITHUB_ENV `
            -Append -Encoding utf8

          New-Item -ItemType Directory -Force `
            "$env:RUNNER_TEMP\intel-logs" |
            Out-Null

          Write-Host "Cloud preflight successful."

      # =========================================
      # 2. ENSURE VISUAL STUDIO COMPONENTS
      # =========================================
      - name: Ensure Visual Studio Components
        shell: pwsh
        run: |
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"

          $vsPath = $env:VS_PATH

          $required = @(
            "Microsoft.VisualStudio.Component.VC.CLI.Support",
            "Microsoft.VisualStudio.Component.VC.ATLMFC"
          )

          $missing = @()

          foreach ($component in $required) {

            $found = & $vswhere -latest -products '*' `
              -requires $component `
              -property installationPath

            if (!$found) {
              $missing += $component
              Write-Warning "Missing component: $component"
            } else {
              Write-Host "Found component: $component"
            }
          }

          if ($missing.Count -gt 0) {

            $setup = Join-Path `
              ${env:ProgramFiles(x86)} `
              "Microsoft Visual Studio/Installer/setup.exe"

            if (!(Test-Path $setup)) {
              throw "Visual Studio Installer setup.exe not found."
            }

            Write-Host "Installing missing Visual Studio components..."

            $modifyArgs = @(
              "modify",
              "--installPath", $vsPath,
              "--quiet",
              "--wait",
              "--norestart"
            )

            foreach ($component in $missing) {
              $modifyArgs += @("--add", $component)
            }

            & $setup @modifyArgs

            $code = $LASTEXITCODE

            if ($code -notin @(0, 3010)) {
              throw "Visual Studio modification failed: $code"
            }

            Write-Host "Visual Studio modification exit code: $code"
          }

          Write-Host "Visual Studio component check completed."

      # =========================================
      # 3. CHECKOUT DELTARES SOURCE
      # =========================================
      - name: Checkout Deltares Source
        uses: actions/checkout@v7
        with:
          repository: Deltares/Delft3D
          ref: 5a4649830b1e5072caf019fb4850bbdefd9ad431
          path: Delft3D
          fetch-depth: 1

      - name: Verify Source Revision
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\Delft3D"

          $expected = "5a4649830b1e5072caf019fb4850bbdefd9ad431"
          $actual = (git rev-parse HEAD).Trim()

          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"

          if ($actual -ne $expected) {
            throw "Incorrect Deltares source revision."
          }

          if (!(Test-Path ".\build.bat")) {
            throw "Deltares build.bat missing."
          }

          Write-Host "Source revision verified."

      # =========================================
      # 4. DOWNLOAD INTEL TOOLKITS
      # =========================================
      - name: Download Intel Base Toolkit
        shell: pwsh
        run: |
          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e83a8e64-04fc-45df-85c6-c2208d03bdb5/w_BaseKit_p_2024.2.0.635_offline.exe"

          $file = "$env:RUNNER_TEMP\basekit.exe"

          Write-Host "Downloading Intel Base Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $file $url

          if ($LASTEXITCODE -ne 0) {
            throw "Intel Base download failed."
          }

          Get-Item $file |
            Select-Object Name, Length

      - name: Download Intel HPC Toolkit
        shell: pwsh
        run: |
          $url = "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d500705-397e-41b3-8b2b-2a3da1753fc2/w_HPCKit_p_2024.2.0.633_offline.exe"

          $file = "$env:RUNNER_TEMP\hpckit.exe"

          Write-Host "Downloading Intel HPC Toolkit..."

          curl.exe -L --fail --retry 3 `
            -o $file $url

          if ($LASTEXITCODE -ne 0) {
            throw "Intel HPC download failed."
          }

          Get-Item $file |
            Select-Object Name, Length

      # =========================================
      # 5. INSTALL INTEL MKL
      # =========================================
      - name: Install Intel oneMKL
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\basekit.exe"
          $log = "$env:RUNNER_TEMP\intel-logs\base"

          Write-Host "Installing Intel oneMKL..."

          $installerArgs = @(
            "-s",
            "-a",
            "--silent",
            "--eula",
            "accept",
            "--action",
            "install",
            "--components",
            "intel.oneapi.win.mkl.devel"
          )

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList $installerArgs `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput "$log-out.txt" `
            -RedirectStandardError "$log-error.txt"

          "Base Toolkit Exit Code: $($proc.ExitCode)" |
            Set-Content "$log-status.txt"

          Get-Content "$log-out.txt" `
            -ErrorAction SilentlyContinue

          Get-Content "$log-error.txt" `
            -ErrorAction SilentlyContinue

          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "oneMKL installation failed: $($proc.ExitCode)"
          }

          Write-Host "oneMKL installation completed."

      # =========================================
      # 6. INSTALL FORTRAN + MPI
      # =========================================
      - name: Install Intel Fortran and MPI
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\hpckit.exe"
          $log = "$env:RUNNER_TEMP\intel-logs\hpc"

          Write-Host "Installing Intel Fortran and MPI..."

          $components = "intel.oneapi.win.mpi.devel:intel.oneapi.win.ifort-compiler"

          $installerArgs = @(
            "-s",
            "-a",
            "--silent",
            "--eula",
            "accept",
            "--action",
            "install",
            "--components",
            $components
          )

          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList $installerArgs `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput "$log-out.txt" `
            -RedirectStandardError "$log-error.txt"

          "HPC Toolkit Exit Code: $($proc.ExitCode)" |
            Set-Content "$log-status.txt"

          Get-Content "$log-out.txt" `
            -ErrorAction SilentlyContinue

          Get-Content "$log-error.txt" `
            -ErrorAction SilentlyContinue

          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Fortran/MPI installation failed: $($proc.ExitCode)"
          }

          Write-Host "Fortran and MPI installation completed."

      # =========================================
      # 7. VERIFY INTEL TOOLCHAIN
      # =========================================
      - name: Verify Intel Toolchain
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 vs2022

          if errorlevel 1 exit /b 1

          set "ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI"
          set "IFORT_COMPILER24=%ONEAPI_ROOT%\compiler\latest"
          set "I_MPI_ONEAPI_ROOT=%ONEAPI_ROOT%\mpi\latest"
          set "VS2022INSTALLDIR=%VS_PATH%"

          echo ===== IFX LOCATION =====

          echo IFORT_COMPILER24=%IFORT_COMPILER24%

          if not exist "%IFORT_COMPILER24%\bin\ifx.exe" (
            echo Intel Fortran compiler not found.
            exit /b 1
          )

          where ifx
          if errorlevel 1 exit /b 1

          echo ===== FORTRAN SMOKE TEST =====

          cd /d "%RUNNER_TEMP%"

          > hello.f90 echo program hello
          >> hello.f90 echo print *, "IFX_COMPILE_OK"
          >> hello.f90 echo end program hello

          ifx hello.f90

          if errorlevel 1 exit /b 1

          if not exist hello.exe exit /b 1

          hello.exe

          if errorlevel 1 exit /b 1

          echo ===== MPI =====

          where mpiexec

          if errorlevel 1 exit /b 1

          mpiexec -version

          if errorlevel 1 exit /b 1

          echo ===== VISUAL STUDIO =====

          echo VS_PATH=%VS_PATH%
          echo VS2022INSTALLDIR=%VS2022INSTALLDIR%
          echo VisualStudioVersion=%VisualStudioVersion%

          echo ===== INTEL ENVIRONMENT READY =====

      # =========================================
      # 8. VERIFY INTEL MKL
      # =========================================
      - name: Verify Intel MKL
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Intel\oneAPI\mkl"

          if (!(Test-Path $root)) {
            throw "oneMKL directory not found."
          }

          $header = Get-ChildItem `
            -Path $root `
            -Filter "mkl.h" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$header) {
            throw "MKL header mkl.h not found."
          }

          Write-Host "MKL verified:"
          Write-Host $header.FullName

      # =========================================
      # 9. BUILD FLOW + MORPHOLOGY
      # =========================================
      - name: Build FLOW and Morphology
        shell: cmd
        run: |
          echo ===== INITIALIZE INTEL ONEAPI =====

          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 vs2022

          if errorlevel 1 exit /b 1

          echo.
          echo ===== FIX INTEL ENVIRONMENT VARIABLES =====

          set "ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI"
          set "IFORT_COMPILER24=%ONEAPI_ROOT%\compiler\latest"
          set "I_MPI_ONEAPI_ROOT=%ONEAPI_ROOT%\mpi\latest"
          set "VS2022INSTALLDIR=%VS_PATH%"

          echo IFORT_COMPILER24=%IFORT_COMPILER24%
          echo ONEAPI_ROOT=%ONEAPI_ROOT%
          echo I_MPI_ONEAPI_ROOT=%I_MPI_ONEAPI_ROOT%
          echo VS2022INSTALLDIR=%VS2022INSTALLDIR%

          if not exist "%IFORT_COMPILER24%\bin\ifx.exe" (
            echo Intel Fortran compiler not found.
            exit /b 1
          )

          if not exist "%VS2022INSTALLDIR%\VC\Auxiliary\Build\vcvarsall.bat" (
            echo Visual Studio environment script not found.
            exit /b 1
          )

          echo.
          echo ===== VERIFY COMPILERS =====

          where ifx
          if errorlevel 1 exit /b 1

          where mpiexec
          if errorlevel 1 exit /b 1

          echo.
          echo ===== BUILD FLOW2D3D =====

          cd /d "%GITHUB_WORKSPACE%\Delft3D"

          set "CMAKE_BUILD_PARALLEL_LEVEL=1"

          call build.bat -config flow2d3d -build_type Release -compiler ifx -vs 2022 -build

          if errorlevel 1 (
            echo FLOW BUILD FAILED
            exit /b 1
          )

          if not exist "install_flow2d3d" (
            echo FLOW INSTALL DIRECTORY MISSING
            exit /b 1
          )

          echo FLOW BUILD SUCCESSFUL

      # =========================================
      # 10. BUILD WAVE + SWAN
      # =========================================
      - name: Build WAVE and SWAN
        shell: cmd
        run: |
          echo ===== INITIALIZE INTEL ONEAPI =====

          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" intel64 vs2022

          if errorlevel 1 exit /b 1

          echo.
          echo ===== FIX INTEL ENVIRONMENT VARIABLES =====

          set "ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI"
          set "IFORT_COMPILER24=%ONEAPI_ROOT%\compiler\latest"
          set "I_MPI_ONEAPI_ROOT=%ONEAPI_ROOT%\mpi\latest"
          set "VS2022INSTALLDIR=%VS_PATH%"

          echo IFORT_COMPILER24=%IFORT_COMPILER24%
          echo VS2022INSTALLDIR=%VS2022INSTALLDIR%

          if not exist "%IFORT_COMPILER24%\bin\ifx.exe" (
            echo Intel Fortran compiler not found.
            exit /b 1
          )

          echo.
          echo ===== BUILD DWAVES =====

          cd /d "%GITHUB_WORKSPACE%\Delft3D"

          set "CMAKE_BUILD_PARALLEL_LEVEL=1"

          call build.bat -config dwaves -build_type Release -compiler ifx -vs 2022 -build

          if errorlevel 1 (
            echo WAVE BUILD FAILED
            exit /b 1
          )

          if not exist "install_dwaves" (
            echo WAVE INSTALL DIRECTORY MISSING
            exit /b 1
          )

          echo WAVE BUILD SUCCESSFUL

      # =========================================
      # 11. INSPECT BUILD OUTPUTS
      # =========================================
      - name: Inspect Build Outputs
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\Delft3D"
          $summary = "$env:RUNNER_TEMP\delft3d-build-summary.txt"

          "DELFT3D FULL HM BUILD SUMMARY" |
            Set-Content $summary

          "SOURCE REVISION: 5a4649830b1e5072caf019fb4850bbdefd9ad431" |
            Add-Content $summary

          foreach ($name in @(
            "install_flow2d3d",
            "install_dwaves",
            "build_flow2d3d",
            "build_dwaves"
          )) {

            $dir = Join-Path $root $name

            "`n===== $name =====" |
              Add-Content $summary

            if (Test-Path $dir) {

              Get-ChildItem $dir -Recurse -File |
                Where-Object {
                  $_.Extension -in @(
                    ".exe", ".dll", ".lib", ".mod", ".log"
                  )
                } |
                Select-Object FullName, Length |
                Format-Table -AutoSize |
                Out-String |
                Add-Content $summary

            } else {

              "DIRECTORY NOT FOUND" |
                Add-Content $summary
            }
          }

          Write-Host "Build summary:"
          Get-Content $summary

      # =========================================
      # 12. UPLOAD BUILD ARTIFACTS AND LOGS
      # =========================================
      - name: Upload Delft3D Build Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delft3d-40702-windows-full-hm
          path: |
            Delft3D/install_flow2d3d/
            Delft3D/install_dwaves/
            Delft3D/build_flow2d3d/*.log
            Delft3D/build_flow2d3d/CMakeCache.txt
            Delft3D/build_dwaves/*.log
            Delft3D/build_dwaves/CMakeCache.txt
            ${{ runner.temp }}/intel-logs/
            ${{ runner.temp }}/delft3d-build-summary.txt
          if-no-files-found: warn
          retention-days: 7

      # =========================================
      # 13. CLEANUP
      # =========================================
      - name: Cleanup Intel Installers
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP\basekit.exe" `
            -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:RUNNER_TEMP\hpckit.exe" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "Temporary Intel installers cleaned."
